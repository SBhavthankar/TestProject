name: SonarQube SAST Analysis - C# .NET

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
      - 'hotfix/**'
      - 'bugfix/**'
    types: [opened, synchronize, reopened]

jobs:
  sonarqube-sast-csharp:
    name: SAST - SonarQube C# Analysis
    runs-on: windows-latest   # Use windows-latest for full .NET Framework support
                              # Use ubuntu-latest if targeting .NET Core / .NET 5+ only

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # Full history required for blame info and accurate analysis

      # ── 2. Setup .NET SDK ──────────────────────────────────────────────────
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
          # Add or remove versions to match your project's target framework(s)
          # e.g. use '4.8.x' for .NET Framework (Windows runner required)

      # ── 3. Set up Java (required by SonarScanner for .NET) ─────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Cache SonarQube packages ────────────────────────────────────────
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ── 5. Cache SonarScanner for .NET tool ───────────────────────────────
      - name: Cache SonarScanner for .NET
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      # ── 6. Install SonarScanner for .NET ──────────────────────────────────
      - name: Install SonarScanner for .NET
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner `
            --tool-path .\.sonar\scanner

      # ── 7. Restore NuGet dependencies ─────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore

      # ── 8. Begin SonarQube analysis ───────────────────────────────────────
      - name: Begin SonarQube Analysis
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /o:"$env:SONAR_ORGANIZATION" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.scanner.scanAll=false
            # /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"
            # Uncomment above to exclude EF migrations and build output

      # ── 9. Build the project ──────────────────────────────────────────────
      - name: Build solution
        run: |
          dotnet build --no-restore --configuration Release
        # Replace with your solution file if needed:
        # dotnet build MyApp.sln --no-restore --configuration Release

      # ── 10. Run unit tests with code coverage ─────────────────────────────
      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage" `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true   # Don't block SAST if tests fail; gate will catch it

      # ── 11. End SonarQube analysis & publish results ──────────────────────
      - name: End SonarQube Analysis
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"

      # ── 12. Quality Gate check ────────────────────────────────────────────
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate status
        run: |
          echo "Quality Gate Status: ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
          if ("${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}" -ne "PASSED") {
            Write-Error "Quality Gate FAILED — blocking merge."
            exit 1
          }

      # ── 13. Upload test results as artifact ───────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: |
            **/*.trx
            **/coverage.opencover.xml
          retention-days: 30

      # ── 14. Comment PR with results ───────────────────────────────────────
      - name: Comment PR with SAST results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## SonarQube SAST Results (C# / .NET)\n' +
                    '**Quality Gate:** ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}\n\n' +
                    'View full report: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ secrets.SONAR_PROJECT_KEY }}'
            })

  summary:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: [sonarqube-sast-csharp]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment PR with security summary
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const sast = '${{ needs.sonarqube-sast-csharp.result }}';
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## SonarQube Security Suite Summary\n\n` +
                    `| Check | Status |\n` +
                    `|---|---|\n` +
                    `| SAST (Static Analysis) | ${icon(sast)} ${sast} |\n\n` +
                    `View full dashboard: ${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ secrets.SONAR_PROJECT_KEY }}`
            });
